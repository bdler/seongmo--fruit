:root {

  --avail-h: max(120px, calc(var(--view-h) - var(--hud-h) - var(--evo-h) - 2 * var(--gap) - 2 * var(--pad) - var(--safe-t) - var(--safe-b)));

#app {

  height: 100vh;
  height: 100dvh;
  padding:
    calc(var(--pad) + var(--safe-t))

/* ---------- HUD ---------- */

#hud {
  flex: none;
  width: var(--ui-w);
  height: var(--hud-h);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 10px;
  background: rgba(255, 255, 255, 0.62);
  border-radius: 20px;
  box-shadow: 0 2px 0 rgba(224, 185, 121, 0.6);

.hud-block {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  line-height: 1;

  margin-bottom: 3px;
  font-size: 11px;
  font-weight: 700;

  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}

/* 숫자 줄 높이를 같게 둬서 '점수'/'최고' 라벨의 세로 위치가 맞는다 */
#score, #best { line-height: 30px; }
#score { font-size: clamp(20px, 6.4vw, 28px); color: var(--accent-dark); }
#best { font-size: clamp(16px, 5vw, 22px); color: var(--ink); }

.hud-next {
  flex: none;
  align-items: center;
}

.hud-next .hud-label { margin-bottom: 2px; }

#next-canvas {
  display: block;

}

.icon-btn:active { transform: scale(0.92); }
.icon-btn[aria-pressed="true"] { background: #ffe0b2; }

/* ---------- 게임판 ---------- */

#stage {
  position: relative;
  flex: none;
  width: var(--stage-w);
  aspect-ratio: 2 / 3;
  overflow: hidden;
  isolation: isolate;
  background: #fff6dd;
  border-radius: var(--radius-board);
  box-shadow: 0 8px 20px rgba(140, 90, 20, 0.22);
}

@supports not (aspect-ratio: 2 / 3) {
  #stage::before {
    content: "";
    display: block;
    padding-top: 150%;
  }

#game-canvas {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;

#clear-banner {

  24%  { transform: translate(-50%, -50%) scale(1) rotate(0deg); }

/* ---------- 오버레이 / 패널 ---------- */

.overlay {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  background: rgba(255, 244, 214, 0.72);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}

/* 게임오버 패널에는 10행짜리 랭킹이 있어 내부 스크롤이 필요하다 */
.panel {
  width: 100%;
  max-height: 100%;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
  padding: 18px 16px 16px;
  text-align: center;
  color: var(--ink);
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 22px;
  box-shadow: 0 10px 30px rgba(120, 70, 10, 0.25);
  animation: panel-in 0.22s ease-out both;
  /* 한글은 글자 단위가 아니라 어절 단위로 줄바꿈한다 */
  word-break: keep-all;
  overflow-wrap: anywhere;
}

.panel > :first-child { margin-top: 0; }
.panel > :last-child { margin-bottom: 0; }

@keyframes panel-in {
  from { opacity: 0; transform: translateY(8px) scale(0.97); }
  to   { opacity: 1; transform: none; }
}

.panel h1 { margin: 0 0 8px; font-size: clamp(22px, 7vw, 30px); line-height: 1.2; }
.panel h2 { margin: 0 0 6px; font-size: clamp(20px, 6.4vw, 26px); line-height: 1.2; }
.panel h3 { margin: 16px 0 6px; font-size: 17px; }
/* :where 로 특이도를 0 으로 둬서 .final/.sub/.badge 등 개별 규칙이 이기게 한다 */
:where(.panel) p { margin: 8px 0; font-size: 14px; }

.how-to {
  margin: 12px 0 14px;
  padding: 10px 12px 10px 28px;
  text-align: left;
  font-size: 14px;
  line-height: 1.5;
  background: #fff3d1;
  border-radius: 14px;
}

.how-to li + li { margin-top: 4px; }

.final {
  margin: 6px 0 0;
  font-size: 14px;
  font-weight: 700;
  color: var(--ink-soft);
}

.final strong {
  display: block;
  font-size: clamp(40px, 13vw, 56px);
  line-height: 1.05;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  color: var(--accent-dark);
}

.sub { color: var(--ink-soft); font-size: 13px; }

.badge {
  display: inline-block;
  margin: 6px 0 0;
  padding: 4px 12px;
  font-size: 14px;
  font-weight: 800;
  color: var(--ink);
  background: #ffe082;
  border-radius: 999px;
}

.error {
  padding: 8px 12px;
  font-size: 14px;
  font-weight: 600;
  color: var(--danger);
  background: #ffebee;
  border-radius: 12px;
}

.ok, .success {
  padding: 8px 12px;
  font-size: 14px;
  font-weight: 600;
  color: #2e7d32;
  background: #e8f5e9;
  border-radius: 12px;
}

/* 상태 문구 자리. 비어 있으면 공간을 차지하지 않지만 aria-live 영역으로는 남는다 */
#submit-status, #ranking-status, #ranking-view-status {
  margin: 6px 0;
  min-height: 1.3em;
  font-size: 13px;
  color: var(--ink-soft);
}

#submit-status:empty, #ranking-status:empty, #ranking-view-status:empty {
  margin: 0;
  min-height: 0;
}

/* ---------- 버튼 ---------- */

.btn {
  --edge: #e0b979;
  min-height: 44px;
  padding: 0 18px;
  font-size: 16px;
  font-weight: 800;
  line-height: 1.2;
  white-space: nowrap;
  color: var(--ink);
  background: #ffffff;
  border: 2px solid var(--edge);
  border-radius: 999px;
  box-shadow: 0 3px 0 var(--edge);
  transition: transform 0.08s ease, filter 0.15s ease;
}

.btn.primary {
  --edge: var(--accent-dark);
  color: #ffffff;
  text-shadow: 0 1px 0 rgba(90, 20, 0, 0.35);
  background: linear-gradient(180deg, #cc3d12, #bf360c); /* 흰 글자 대비 4.9~5.6:1 (WCAG AA) */
}

.btn:active { transform: translateY(2px); }

.btn:disabled,
.btn[aria-disabled="true"] {
  opacity: 0.55;
  cursor: not-allowed;
  transform: none;
}

@media (hover: hover) {
  .btn:not(:disabled):hover { filter: brightness(1.05); }
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}

.btn-row .btn { flex: 1 1 130px; }

/* 긴 패널을 스크롤해도 닫기/다시 하기/게임 시작 버튼은 항상 보이게.
   sticky 의 bottom 은 패널 패딩을 뺀 콘텐츠 상자 기준이라 bottom:0 이면 스크롤 끝의 자연스러운 위치와 같다.
   버튼 아래 패딩 띠로 목록이 비쳐 보이지 않도록 카드색 그림자를 아래로 길게 깐다. */
#btn-restart,
#btn-close-ranking {
  position: sticky;
  bottom: 0;
  z-index: 1;
  display: block;
  width: 100%;
  margin-top: 14px;
  box-shadow: 0 3px 0 var(--edge), 0 0 0 10px var(--card), 0 24px 0 10px var(--card);
}

/* 시작 화면은 버튼이 한 줄(.btn-row)이라 줄 전체를 고정하고, 줄 주변을 카드색으로 덮는다.
   낮은 화면에서 설명이 길어 패널이 스크롤돼도 '게임 시작'이 첫 화면에 보인다. */
.panel > .btn-row {
  position: sticky;
  bottom: 0;
  z-index: 1;
  background: var(--card);
  box-shadow: 0 0 0 10px var(--card), 0 24px 0 10px var(--card);
}

/* ---------- 닉네임 폼 ---------- */

#submit-form {
  margin: 12px 0 0;
  text-align: left;
}

#submit-form label {
  display: block;
  margin: 0 0 4px 2px;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-soft);
}

/* 줄바꿈은 뷰포트가 아니라 패널의 실제 폭이 정한다: 입력창이 9em 보다 좁아질 자리면 버튼이 아래 줄로 내려간다 */
form .row {
  display: flex;
  flex-wrap: wrap;
  align-items: stretch;
  gap: 8px;
}

form .row input {
  flex: 1 1 9em;
  min-width: 0;
  height: 44px;
  padding: 0 12px;
  font-size: 16px; /* 16px 미만이면 iOS 가 입력 시 화면을 확대한다 */
  color: var(--ink);
  background: #ffffff;
  border: 2px solid var(--line);
  border-radius: 12px;
  -webkit-user-select: text;
  user-select: text;
  -webkit-touch-callout: default;
}

form .row input:focus-visible {
  border-color: var(--accent);
  outline-offset: 0;
}

form .row .btn { flex: 1 0 auto; }

/* ---------- 랭킹 ---------- */

.ranking {
  margin: 8px 0 0;
  padding: 0;
  list-style: none;
  text-align: left;
}

/* li 의 자식은 [순위, 이름, 점수] 순서의 3개. 클래스가 아니라 위치로 스타일한다 */
.ranking > li {
  display: grid;
  grid-template-columns: 2.4em minmax(0, 1fr) auto;
  align-items: center;
  column-gap: 8px;
  min-height: 32px;
  margin: 0 0 4px;
  padding: 5px 10px;
  font-size: 14px;
  background: rgba(255, 244, 214, 0.6);
  border-radius: 12px;
}

.ranking > li > :nth-child(1) {
  font-weight: 900;
  text-align: center;
  color: var(--ink-soft);
}

.ranking > li > :nth-child(2) {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ranking > li > :nth-child(3) {
  font-weight: 800;
  text-align: right;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.ranking > li:nth-child(-n+3) { font-weight: 700; }
.ranking > li:nth-child(1) { background: linear-gradient(90deg, #fff1b8, #ffe082); }
.ranking > li:nth-child(2) { background: linear-gradient(90deg, #f3f5f8, #dfe3ea); }
.ranking > li:nth-child(3) { background: linear-gradient(90deg, #ffe6d3, #ffcba4); }
.ranking > li:nth-child(1) > :nth-child(1) { color: #7a5200; }
.ranking > li:nth-child(2) > :nth-child(1) { color: #455a64; }
.ranking > li:nth-child(3) > :nth-child(1) { color: #8a4524; }

.ranking > li.me { outline: 2px solid var(--accent); outline-offset: -2px; }

/* ---------- 진화 순서 ---------- */

#evolution {
  flex: none;
  width: var(--ui-w);
  height: var(--evo-h);
}

#evolution-list {
  --unit: clamp(2.6px, 1vw, 3.6px);
  height: 100%;
  margin: 0;
  padding: 0 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  overflow: hidden;
  white-space: nowrap;
  list-style: none;
  font-family: var(--font-emoji);
  background: rgba(255, 255, 255, 0.62);
  border-radius: 999px;
}

/* 레벨이 오를수록 커지게. 마크업(클래스/속성)에 의존하지 않도록 순서로 지정한다.
   320px 폭에서도 한 줄에 들어가도록 단위를 뷰포트 폭에 맞춰 줄인다 */
#evolution-list > li {
  flex: 0 1 auto;
  min-width: 0;
  line-height: 1;
  font-size: calc((3.4 + var(--i, 0) * 0.4) * var(--unit));
}

#evolution-list > li:nth-child(1)  { --i: 0; }
#evolution-list > li:nth-child(2)  { --i: 1; }
#evolution-list > li:nth-child(3)  { --i: 2; }
#evolution-list > li:nth-child(4)  { --i: 3; }
#evolution-list > li:nth-child(5)  { --i: 4; }
#evolution-list > li:nth-child(6)  { --i: 5; }
#evolution-list > li:nth-child(7)  { --i: 6; }
#evolution-list > li:nth-child(8)  { --i: 7; }
#evolution-list > li:nth-child(9)  { --i: 8; }
#evolution-list > li:nth-child(10) { --i: 9; }
#evolution-list > li:nth-child(11) { --i: 10; }

/* ---------- 낮은 화면 ---------- */

@media (max-height: 600px) {
  .panel { padding: 12px; }
  .panel h1 { font-size: 22px; }
  .how-to { margin: 8px 0 10px; font-size: 13px; }
  .final strong { font-size: 40px; }
}

/* ---------- 가로 모드 / 아주 낮은 화면 ----------
   가로로 눕힌 폰이나 200~300% 로 확대한 데스크톱은 높이가 모자라, 세로 한 줄 배치에서는 게임판이 130~180px 로 쪼그라들고
   패널이 그 안에 갇힌다. 게임판을 왼쪽에 최대한 크게 두고 HUD/진화 줄을 오른쪽에 세우며,
   패널은 게임판이 아니라 화면 기준으로 펼쳐 시작 버튼과 닉네임 입력이 항상 쓸 만한 크기가 되게 한다. */

@media (orientation: landscape) and (max-height: 500px) {
  :root {
    --avail-h: max(120px, calc(var(--view-h) - 2 * var(--pad) - var(--safe-t) - var(--safe-b)));
    --stage-w: calc(var(--avail-h) * 2 / 3);
  }

  #app {
    max-width: none;
    display: grid;
    grid-template-columns: var(--stage-w) minmax(0, 320px);
    grid-template-rows: 1fr auto auto 1fr;
    grid-template-areas:
      "stage ."
      "stage hud"
      "stage evo"
      "stage .";
    justify-content: center;
    align-content: center;
    align-items: center;
    column-gap: calc(var(--gap) * 2);
  }

  #stage { grid-area: stage; }
  #hud { grid-area: hud; width: auto; }
  #evolution { grid-area: evo; width: auto; }

  .overlay {
    position: fixed;
    padding:
      calc(var(--pad) + var(--safe-t))
      calc(var(--pad) + var(--safe-r))
      calc(var(--pad) + var(--safe-b))
      calc(var(--pad) + var(--safe-l));
  }

  .panel { max-width: 360px; }
}

/* 그래도 모자란 극단적인 크기에서는 잘리지 않고 스크롤되게 한다 */
@media (max-height: 255px) {
  body { overflow: auto; }
}

/* ---------- 모션 최소화 ---------- */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-block">
        <span class="hud-label">점수</span>
        <strong id="score">0</strong>
      </div>
      <div class="hud-block">
        <span class="hud-label">최고</span>
        <strong id="best">0</strong>
      </div>
      <div class="hud-block hud-next">
        <span class="hud-label">다음</span>
        <canvas id="next-canvas" width="64" height="64" aria-label="다음 과일"></canvas>
      </div>
      <button id="btn-mute" class="icon-btn" type="button" aria-pressed="false" aria-label="음소거">🔊</button>
    </header>

    <main id="stage">
      <canvas id="game-canvas" aria-label="과일 합치기 게임 화면"></canvas>
      <div id="clear-banner" role="status" hidden>🍉 수박 완성!</div>

      <section id="screen-start" class="overlay" aria-labelledby="start-title">
        <div class="panel">
          <h1 id="start-title">🍉 수박 합치기</h1>
          <p>같은 과일끼리 합쳐 더 큰 과일로! 상자 밖으로 넘치기 전에 수박을 만들어 보세요.</p>
          <ul class="how-to">
            <li>화면을 누른 채 좌우로 움직여 위치를 정하고, 손을 떼면 과일이 떨어져요.</li>
            <li>PC: ← → 로 이동, 스페이스로 떨어뜨리기</li>
          </ul>
          <p id="start-error" class="error" role="alert" hidden></p>
          <div class="btn-row">
            <button id="btn-start" class="btn primary" type="button">게임 시작</button>
            <button id="btn-view-ranking" class="btn" type="button">🏆 랭킹 보기</button>
          </div>
        </div>
      </section>

      <section id="screen-gameover" class="overlay" aria-labelledby="gameover-title" hidden>
        <div class="panel">
          <h2 id="gameover-title">게임 오버</h2>
          <p class="final">점수 <strong id="final-score">0</strong></p>
          <p id="new-record" class="badge" hidden>🎉 신기록!</p>
          <p class="sub">최고 점수 <span id="final-best">0</span> · 최고 과일 <span id="final-fruit">-</span></p>

          <form id="submit-form" autocomplete="off">
            <label for="input-nickname">닉네임</label>
            <div class="row">
              <input id="input-nickname" type="text" maxlength="12" placeholder="닉네임 (최대 12자)" enterkeyhint="send">
              <button id="btn-submit" class="btn primary" type="submit">랭킹 등록</button>
            </div>
          </form>
          <p id="submit-status" role="status" aria-live="polite"></p>

          <h3>🏆 랭킹</h3>
          <p id="ranking-status" role="status" aria-live="polite"></p>
          <ol id="ranking-list" class="ranking"></ol>

          <button id="btn-restart" class="btn primary" type="button">다시 하기</button>
        </div>
      </section>

      <section id="screen-ranking" class="overlay" aria-labelledby="ranking-title" hidden>
        <div class="panel">
          <h2 id="ranking-title">🏆 랭킹</h2>
          <p id="ranking-view-status" role="status" aria-live="polite"></p>
          <ol id="ranking-view-list" class="ranking"></ol>
          <button id="btn-close-ranking" class="btn" type="button">닫기</button>
        </div>
      </section>
    </main>

    <footer id="evolution" aria-label="과일 진화 순서">
      <ol id="evolution-list"></ol>
    </footer>
  </div>

        dom.btnSubmit.textContent = SUBMIT_LABEL.done;
        dom.inputNickname.disabled = true;
        ranking.load(dom.rankingList, dom.rankingStatus);
        return;
      }
      setStatus(SUBMIT_ERRORS[code] ?? MSG.submitFailed);
      if (RETRYABLE.has(code)) dom.btnSubmit.textContent = SUBMIT_LABEL.retry;
      if (RETRYABLE.has(code) || code === "invalid_nickname") {
        dom.btnSubmit.disabled = false;
        focusSoft(code === "invalid_nickname" ? dom.inputNickname : dom.btnSubmit);
      }
    }
    async function onSubmit(event) {
      event.preventDefault();
      if (!result || busy || done) return;
      const nickname = dom.inputNickname.value.trim();
      if (nickname.length < 1 || nickname.length > NICKNAME_MAX) {
        setStatus(MSG.nicknameRule);
        focusSoft(dom.inputNickname);
        return;
      }
      setNickname(nickname);
      const mine = result;
      const payload = {
        nickname,
        score: mine.score,
        maxLevel: mine.maxLevel,
        playTimeMs: mine.playTimeMs,
        drops: mine.drops,
        clientId: getClientId()
      };
      busy = true;
      dom.btnSubmit.disabled = true;
      setStatus(MSG.submitting);
      let res;
      try {
        res = await submitScore(payload);
      } catch {
        res = { ok: false, error: "network" };
      }
      busy = false;
      onSubmitResult(res, payload, mine);
    }
    dom.submitForm.addEventListener("submit", onSubmit);
    return { show, hide };
  }
  async function resubmitPending() {
    if (!isApiConfigured()) return;
    const pending = getPending();
    if (!pending) return;
    let res;
    try {
      res = await submitScore({ ...pending, clientId: pending.clientId ?? getClientId() });
    } catch {
      return;
    }
    if (res?.ok || res && !RETRYABLE.has(res.error)) clearPending();
  }
  var isOverlayOpen = (dom) => [dom.screenStart, dom.screenGameover, dom.screenRanking].some((el) => !el.hidden);
  function heldX(app) {
    const r = FRUITS[app.game.current ?? 0].radius;
    return clamp2(app.aimX, r, WORLD.width - r);
  }
  function startGame(app) {
    const { dom, game } = app;
    app.audio.unlock();
    dom.screenStart.hidden = true;
    dom.screenRanking.hidden = true;
    app.panel.hide();
    app.physics.clear();
    game.start(app.simTime);
    app.aimX = WORLD.width / 2;
    app.acc = 0;
    app.last = null;
    app.best = getBest();
    app.hud.setScore(0);
    app.hud.setBest(app.best);
    app.hud.hideBanner();
    app.renderer.drawNext(game.next);
    document.activeElement?.blur?.();
  }
  function dropFruit(app) {
    const { game } = app;
    if (isOverlayOpen(app.dom)) return;
    const x = heldX(app);
    const level = game.drop(app.simTime);
    if (level === null) return;
    app.physics.spawn(level, x, WORLD.spawnY, app.simTime);
    app.audio.play("drop");
    app.renderer.addDropEffect({ x, y: WORLD.spawnY, level });
    app.renderer.drawNext(game.next);
  }
  function handleMerge(app, evt) {
    const { game, hud } = app;
    const wasCleared = game.cleared;
    const points = game.applyMerge(evt);
    hud.setScore(game.score);
    if (game.score > app.best) {
      app.best = game.score;
      hud.setBest(app.best);
    }
    app.audio.play("merge", { level: evt.level });
    app.renderer.addMergeEffect({ x: evt.x, y: evt.y, level: evt.level, bonus: evt.bonus, points });
    if (!wasCleared && game.cleared) {
      hud.showBanner();
      app.audio.play("clear");
    }
  }
  function handleGameOver(app) {
    const { game } = app;
    app.hud.hideBanner();
    app.audio.play("gameover");
    const result = {
      score: game.score,
      maxLevel: game.maxLevel,
      drops: game.drops,
      playTimeMs: Math.round(game.playTimeMs(app.simTime))
    };
    const prevBest = getBest();
    const isRecord = result.score > 0 && result.score > prevBest;
    if (isRecord) setBest(result.score);
    const best = Math.max(prevBest, result.score);
    app.best = best;
    app.hud.setBest(best);
    app.panel.show(result, { best, isRecord });
  }
  function checkOverflow(app) {
    const items = app.physics.bodies().map((body) => ({
      body,
      y: body.position.y,
      radius: FRUITS[body.level].radius,
      bornAt: body.bornAt,
      overSince: body.overSince
    }));
    const over = app.game.checkOverflow(items, app.simTime);
    for (const item of items) item.body.overSince = item.overSince;
    return over;
  }
  function stepOnce(app) {
    app.steps += 1;
    app.simTime = app.steps * TIMING.step;
    app.physics.step(TIMING.step, app.simTime);
    app.game.update(app.simTime);
    if (checkOverflow(app)) handleGameOver(app);
  }
  function advanceSimulation(app, dtMs) {
    if (!app.game.isPlaying) {
      app.acc = 0;
      return;
    }
    app.acc += dtMs;
    while (app.acc >= TIMING.step && app.game.isPlaying) {
      stepOnce(app);
      app.acc -= TIMING.step;
    }
    if (!app.game.isPlaying) app.acc = 0;
  }
  function buildFrame(app, now) {
    const { game, physics, simTime } = app;
    const bodies = physics.bodies().map((b) => ({
      x: b.position.x,
      y: b.position.y,
      angle: b.angle,
      level: b.level,
      popAge: simTime - b.mergedAt
      // 합쳐진 적 없으면 -(-Infinity) = Infinity
    }));
    const held = game.state === "READY" ? { x: heldX(app), level: game.current } : null;
    return { now, time: simTime, state: game.state, bodies, held, danger: game.danger };
  }
  function frame(app, now) {
    app.raf = requestAnimationFrame((t) => frame(app, t));
    const dt = app.last === null ? 0 : clamp2(now - app.last, 0, MAX_FRAME_MS);
    app.last = now;
    if (!app.paused) advanceSimulation(app, dt);
    app.input.update(dt);
    app.renderer.draw(buildFrame(app, now));
  }
  function setupAudio(app) {
    const { dom, audio, hud } = app;
    function applyMuted(muted, persist) {
      audio.setMuted(muted);
      if (persist) setMuted(muted);
      hud.setMuted(muted);
    }
    applyMuted(getMuted(), false);
    dom.btnMute.addEventListener("click", (e) => {
      applyMuted(!audio.isMuted(), true);
      if (e.detail > 0) dom.btnMute.blur();
    });
    for (const type of ["pointerdown", "pointerup", "keydown", "click"]) {
      document.addEventListener(type, () => audio.unlock(), { once: true, capture: true });
    }
    document.addEventListener("click", (e) => {
      if (e.target instanceof Element && e.target.closest("button")) audio.play("click");
    });
  }
  function setupResize(app) {
    let pending = false;
    const resize = () => {
      pending = false;
      app.renderer.resize();
      app.renderer.drawNext(app.game.next);
    };
    const schedule = () => {
      if (pending) return;
      pending = true;
      requestAnimationFrame(resize);
    };
    window.addEventListener("resize", schedule);
    window.addEventListener("orientationchange", schedule);
    if (typeof ResizeObserver === "function") new ResizeObserver(schedule).observe(app.dom.stage);
    resize();
  }
  function setupInput(app) {
    const { dom } = app;
    app.input = createInput({
      canvas: dom.gameCanvas,
      clientToWorld: (cx, cy) => app.renderer.clientToWorld(cx, cy),
      getAimX: () => heldX(app),
      onAim: (x) => void (app.aimX = x),
      onDrop: () => dropFruit(app),
      isBlocked: () => isOverlayOpen(dom)
    });
  }
  function installDebugHook(app) {
    const summarize = (b) => ({
      id: b.id,
      level: b.level,
      x: b.position.x,
      y: b.position.y,
      angle: b.angle,
      vx: b.velocity.x,
      vy: b.velocity.y
    });
    window.__fruit = {
      game: app.game,
      physics: app.physics,
      spawn: (level, x, y) => summarize(app.physics.spawn(level, x, y, app.simTime)),
      bodies: () => app.physics.bodies().map(summarize),
      pause() {
        app.paused = true;
      },
      resume() {
        app.paused = false;
        app.acc = 0;
        app.last = null;
      },
      // 일시정지 중에도 ms 만큼(스텝 단위로 반올림) 결정적으로 진행한다. 진행한 뒤의 시뮬레이션 시간을 돌려준다.
      advance(ms) {
        const n = Math.round(ms / TIMING.step);
        for (let i = 0; i < n && app.game.isPlaying; i++) stepOnce(app);
        return app.simTime;
      },
      // 시작 전이면 먼저 판을 시작한 뒤 즉시 끝낸다.
      forceGameOver() {
        if (app.game.state === "IDLE") startGame(app);
        if (app.game.isPlaying) {
          app.game.endGame(app.simTime);
          handleGameOver(app);
        }
        return app.game.state;
      },
      getState: () => app.game.state,
      getScore: () => app.game.score
    };
  }
  function bootstrap() {
    const dom = queryDom();
    const hud = createHud(dom);
    const ranking = createRankingLoader();
    buildEvolutionList(dom.evolutionList);
    hud.setBest(getBest());
    hud.setScore(0);
    const app = {
      dom,
      hud,
      ranking,
      audio: createAudio(),
      game: createGame(),
      panel: createResultPanel({ dom, ranking }),
      renderer: null,
      physics: null,
      input: null,
      simTime: 0,
      steps: 0,
      acc: 0,
      last: null,
      raf: 0,
      paused: false,
      aimX: WORLD.width / 2,
      best: getBest()
    };
    setupAudio(app);
    setupRankingOverlay(app);
    if (typeof Matter === "undefined") {
      showStartError(dom, MSG.noEngine);
      dom.btnStart.disabled = true;
      return;
    }
    app.renderer = createRenderer(dom.gameCanvas, dom.nextCanvas);
    app.physics = createPhysics({ onMerge: (evt) => handleMerge(app, evt) });
    setupInput(app);
    setupResize(app);
    dom.btnStart.addEventListener("click", () => startGame(app));
    dom.btnRestart.addEventListener("click", () => startGame(app));
    document.addEventListener("visibilitychange", () => void (app.last = null));
    if (new URLSearchParams(location.search).has("debug")) installDebugHook(app);
    resubmitPending().catch(() => {
    });
    if (prefersFinePointer()) focusSoft(dom.btnStart);
    app.raf = requestAnimationFrame((t) => frame(app, t));
  }
  try {
    bootstrap();
  } catch (err) {
    console.error(err);
    const dom = queryDom();
    if (dom.startError) showStartError(dom, MSG.initFailed);
    if (dom.btnStart) dom.btnStart.disabled = true;
  }
})();
</script>
</body>
</html>
